# BuffaloMoneySend API — deploy this repo on Render (Web Service, Node 20)
# This Blueprint provisions both the backend web service and its managed Postgres database.
# Dashboard: New → Blueprint → connect this GitHub repo

services:
  - type: web
    name: buffalomoneysend-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && node --input-type=module -e "await import('pg')"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        fromDatabase:
          name: buffalomoneysend-db
          property: connectionString
      - key: PAYMENT_PROVIDER
        value: "thunes"
      - key: THUNES_BASE_URL
        sync: false
      - key: THUNES_API_KEY
        sync: false
      - key: THUNES_API_SECRET
        sync: false
      - key: THUNES_THAILAND_PAYER_ID
        sync: false
      - key: THUNES_ACCEPT_MERCHANT_ID
        sync: false
      - key: THUNES_ACCEPT_PAYMENT_PAGE_ID
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WEB_APP_URL
        sync: false
      - key: PLATFORM_FEE_PERCENT
        sync: false

databases:
  - name: buffalomoneysend-db
    plan: free
